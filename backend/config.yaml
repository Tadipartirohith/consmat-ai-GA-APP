# =============================================================================
# Consmat AI — SINGLE SOURCE OF ALL VARIABLE DATA
# Edit this file to change catalog, vendors, pricing rules, demo accounts,
# thresholds, seeded orders, ports, etc. Nothing here is hard-coded in the app.
# The backend loads this at startup (hot-editable: restart the api container).
# =============================================================================

# =============================================================================
# GO-LIVE / OPS CONFIGURATION
# These are the settings the ops team should review before testing with real
# data or going to production. Put SECRET values (API keys, gateway secrets)
# in the .env file, not here. This file is committed to git; .env is not.
# See the README section "Configuration for the ops team" for the full walk-through.
# =============================================================================

deployment:
  # Public base URL of the backend API as seen by the browser.
  # Local default is same-origin through the nginx /api proxy, so leave blank.
  # For a real deployment behind domains, set your API URL, e.g.
  #   https://api.consmat.yourcompany.com
  public_api_url: ""
  # Origins allowed to call the API (CORS). "*" is fine for local testing; before
  # going live, replace with the exact front-end domains. This value IS applied.
  allowed_origins: ["*"]
  # Public URLs of the four front-ends (used in links / notifications if enabled).
  frontend_urls:
    buyer:    "http://localhost:8080"
    vendor:   "http://localhost:8081"
    admin:    "http://localhost:8082"
    operator: "http://localhost:8083"

payments:
  # By default payment is a STUB: checkout records the order without charging.
  # To take real money: set provider + enabled, put the secret keys in .env, and
  # wire the gateway adapter in backend/app/routers/buyer.py (checkout). See the
  # README "Configuration for the ops team -> Payment gateway".
  provider: "mock"            # mock | razorpay | stripe | payu | cashfree
  enabled: false
  currency: "INR"
  # Secrets live in .env; these name the variables the adapter should read:
  key_id_env: "PAYMENT_KEY_ID"
  key_secret_env: "PAYMENT_KEY_SECRET"
  webhook_secret_env: "PAYMENT_WEBHOOK_SECRET"

logistics_engine:
  # How road distance is computed. "haversine" needs nothing external and is the
  # default. Switch to "osrm" and set OSRM_URL in .env for real road distances.
  provider: "haversine"       # haversine | osrm
  osrm_url_env: "OSRM_URL"

notifications:
  # Order / dispatch notifications (WhatsApp / SMS). Off by default. To enable,
  # set provider + keys in .env and wire the adapter. See the README.
  provider: "none"            # none | gupshup | msg91 | twilio
  enabled: false

persistence:
  # The demo uses an in-memory store (resets on restart). Before production, move
  # to a real database behind the same store interface (see README "Persistence").
  mode: "memory"              # memory | postgres
  database_url_env: "DATABASE_URL"

app:
  name: "Consmat AI"
  api_prefix: "/api/v1"
  # JWT
  jwt_secret: "change-me-in-prod"
  jwt_alg: "HS256"
  access_token_ttl_min: 1440
  # How many demo orders to synthesize on boot (spread across statuses)
  seed_orders: 14
  # Deterministic seed so generated demo data is stable across restarts
  random_seed: 42

# --- Price <-> Quality engine ------------------------------------------------
pricing:
  rate_per_km: 38
  handling: 600
  quality_gate: 3.3
  load_factor:
    cement: 1.0
    steel: 1.4
    sand: 1.6
    aggregate: 1.6
    bricks: 1.3

# --- Logistics rules (admin "Logistics Rules" screen; flat, editable) --------
logistics_config:
  rate_per_km: 38
  handling_fee: 600
  quality_gate: 3.3
  min_order_value: 5000
  free_delivery_threshold: 50000
  cod_enabled: true
  express_dispatch: false
  default_dispatch_hub: "hub"
  max_delivery_radius_km: 120

# --- Low-stock alert thresholds by unit (operator + vendor) ------------------
low_stock_thresholds:
  bags: 200
  tonnes: 20
  units: 20
  kg: 100
  pcs: 30000
  default: 20

